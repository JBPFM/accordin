[package]
name = "mcs_accordin_direct"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
build = "build.rs"

[lib]
name = "mcs_accordin_direct"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.65"
accordin_shared = { path = "../accordin_shared" }
libbpf-rs = "=0.26.0-beta.1"
libc = "0.2.177"
log = "0.4.17"
scx_utils = { version = "1.0.22", features = ["autopower"] }
simplelog = "0.12"

[build-dependencies]
scx_cargo = { version = "1.0.22" }

[features]
enable_backtrace = []
perf-symbols = []
